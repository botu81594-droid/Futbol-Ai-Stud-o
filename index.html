<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Penaltı & Serbest Vuruş 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white p-2">

    <!-- Üst Skor & Bilgi Paneli -->
    <div class="w-full max-w-xl bg-slate-800/80 backdrop-blur rounded-xl p-4 mb-3 border border-slate-700 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-extrabold text-emerald-400 tracking-wide">FUTBOL 2026</h1>
            <p class="text-xs text-slate-400">Penaltı & Serbest Vuruş</p>
        </div>
        <div class="flex gap-4 text-center">
            <div class="bg-slate-900/60 px-3 py-1 rounded-lg border border-slate-700">
                <div class="text-[10px] text-slate-400 font-bold uppercase">Skor</div>
                <div id="scoreDisplay" class="text-lg font-black text-amber-400">0</div>
            </div>
            <div class="bg-slate-900/60 px-3 py-1 rounded-lg border border-slate-700">
                <div class="text-[10px] text-slate-400 font-bold uppercase">En Yüksek</div>
                <div id="highScoreDisplay" class="text-lg font-black text-emerald-400">0</div>
            </div>
            <div class="bg-slate-900/60 px-3 py-1 rounded-lg border border-slate-700">
                <div class="text-[10px] text-slate-400 font-bold uppercase">Seviye</div>
                <div id="levelDisplay" class="text-lg font-black text-cyan-400">1</div>
            </div>
        </div>
    </div>

    <!-- Oyun Sahası Canvas -->
    <div class="relative w-full max-w-xl flex justify-center">
        <canvas id="gameCanvas" width="480" height="600" class="rounded-xl border-2 border-slate-700 w-full max-w-[480px] h-auto cursor-crosshair"></canvas>
        
        <!-- Mesaj Ekranı Overlay -->
        <div id="messageOverlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center transition-all duration-300">
            <h2 id="msgTitle" class="text-3xl font-black text-emerald-400 mb-2 tracking-wider">ŞUTA HAZIRLAN!</h2>
            <p id="msgSub" class="text-slate-300 text-sm mb-6 text-center px-6">Topu kaleye doğru sürükleyip bırakarak (swipe) şutunu çek.</p>
            <button id="startBtn" onclick="startGame()" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl shadow-lg shadow-emerald-500/30 transition transform active:scale-95 text-lg uppercase tracking-wider">
                BAŞLA
            </button>
        </div>
    </div>

    <!-- Alt İpuçları -->
    <div class="w-full max-w-xl mt-3 text-center text-xs text-slate-400">
        💡 <span class="text-slate-300">İpucu:</span> Farenizle veya parmağınızla hızlıca ileri doğru çizgi çekerek falso ve hız verebilirsiniz.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Oyun Durumu Değişkenleri
        let score = 0;
        let highScore = localStorage.getItem('fb_highScore') || 0;
        let level = 1;
        let gameState = 'START'; // START, AIMING, IN_FLIGHT, GOAL, SAVED, OUT

        document.getElementById('highScoreDisplay').innerText = highScore;

        // Ses Efektleri (Web Audio API)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'kick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'goal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'save') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Kale & Obje Pozisyonları
        const goal = { x: 90, y: 80, width: 300, height: 120 };
        const ball = { x: 240, y: 500, radius: 12, vx: 0, vy: 0, vz: 0, z: 0, spin: 0 };
        const goalkeeper = { x: 240, y: 180, width: 36, height: 50, vx: 2, state: 'IDLE' };
        let barrier = [];

        // Sürükleme Mantığı
        let dragStart = null;
        let dragCurrent = null;

        function initLevel() {
            ball.x = 240;
            ball.y = 500;
            ball.z = 0;
            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;
            ball.spin = 0;

            goalkeeper.x = 240;
            goalkeeper.vx = (1.5 + level * 0.5) * (Math.random() > 0.5 ? 1 : -1);

            // Baraj Oluştur (2. Seviyeden İtibaren)
            barrier = [];
            if (level >= 2) {
                const wallCount = Math.min(4, level);
                const startX = 240 - (wallCount * 18) / 2;
                for (let i = 0; i < wallCount; i++) {
                    barrier.push({ x: startX + i * 20, y: 340, width: 16, height: 45 });
                }
            }
            gameState = 'AIMING';
        }

        function startGame() {
            document.getElementById('messageOverlay').classList.add('hidden');
            score = 0;
            level = 1;
            updateUI();
            initLevel();
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('highScoreDisplay').innerText = highScore;
        }

        // Girdi Dinleyicileri
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'AIMING') return;
            dragStart = getCanvasPos(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (dragStart && gameState === 'AIMING') {
                dragCurrent = getCanvasPos(e);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (!dragStart || gameState !== 'AIMING') return;
            const dragEnd = getCanvasPos(e);
            shootBall(dragStart, dragEnd);
            dragStart = null;
            dragCurrent = null;
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'AIMING') return;
            dragStart = getCanvasPos(e);
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (dragStart && gameState === 'AIMING') {
                dragCurrent = getCanvasPos(e);
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!dragStart || gameState !== 'AIMING') return;
            const dragEnd = e.changedTouches ? {
                x: (e.changedTouches[0].clientX - canvas.getBoundingClientRect().left) * (canvas.width / canvas.getBoundingClientRect().width),
                y: (e.changedTouches[0].clientY - canvas.getBoundingClientRect().top) * (canvas.height / canvas.getBoundingClientRect().height)
            } : dragCurrent;
            shootBall(dragStart, dragEnd);
            dragStart = null;
            dragCurrent = null;
        });

        function shootBall(start, end) {
            const dx = end.x - start.x;
            const dy = end.y - start.y;

            if (dy >= -10) return; // Arkaya veya yana çekmeleri engelle

            ball.vx = dx * 0.08;
            ball.vy = dy * 0.09;
            ball.vz = -dy * 0.03; // Yükseklik hızı
            ball.spin = dx * 0.015; // Falso

            playSound('kick');
            gameState = 'IN_FLIGHT';
        }

        // Oyun Döngüsü ve Güncelleme
        function update() {
            // Kaleci Hareketi
            if (gameState === 'AIMING') {
                goalkeeper.x += goalkeeper.vx;
                if (goalkeeper.x < goal.x + 30 || goalkeeper.x > goal.x + goal.width - 30) {
                    goalkeeper.vx *= -1;
                }
            }

            // Top Hareketi
            if (gameState === 'IN_FLIGHT') {
                ball.x += ball.vx + ball.spin;
                ball.y += ball.vy;
                ball.z += ball.vz;
                ball.vz -= 0.12; // Yerçekimi

                if (ball.z < 0) ball.z = 0;

                // Kaleci Zıplama / Atlama Mekaniği
                if (ball.y < 260 && ball.y > 160) {
                    const targetX = ball.x;
                    goalkeeper.x += (targetX - goalkeeper.x) * 0.12;
                }

                // Çarpışma Kontrolü: Baraj
                barrier.forEach(p => {
                    if (ball.z < 30 &&
                        ball.x > p.x - 10 && ball.x < p.x + p.width + 10 &&
                        ball.y > p.y - 10 && ball.y < p.y + p.height) {
                        ball.vy *= -0.3;
                        ball.vx *= -0.5;
                        playSound('save');
                        endRound('SAVED', 'Baraja Takıldı!');
                    }
                });

                // Çarpışma Kontrolü: Kaleci
                if (Math.abs(ball.x - goalkeeper.x) < 25 &&
                    Math.abs(ball.y - goalkeeper.y) < 25 &&
                    ball.z < 45) {
                    ball.vy *= -0.4;
                    playSound('save');
                    endRound('SAVED', 'Kaleci Kurtardı!');
                }

                // Kale Çizgisine Ulaştı mı?
                if (ball.y <= goal.y + 10) {
                    // Direk ve Gol Kontrolü
                    const inWidth = ball.x > goal.x + 10 && ball.x < goal.x + goal.width - 10;
                    const inHeight = ball.z < goal.height - 10;

                    if (inWidth && inHeight) {
                        playSound('goal');
                        score += 100 + level * 20;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('fb_highScore', highScore);
                        }
                        level++;
                        endRound('GOAL', 'HARİKA GOL!');
                    } else {
                        playSound('save');
                        endRound('OUT', 'AUT!');
                    }
                }
            }
        }

        function endRound(state, text) {
            gameState = state;
            setTimeout(() => {
                const overlay = document.getElementById('messageOverlay');
                document.getElementById('msgTitle').innerText = text;
                document.getElementById('msgSub').innerText = state === 'GOAL' ? 'Sıradaki seviyeye geçiyorsun!' : 'Tekrar dene!';
                document.getElementById('startBtn').innerText = state === 'GOAL' ? 'DEVAM ET' : 'YENİDEN DENE';
                overlay.classList.remove('hidden');
                updateUI();
            }, 600);
        }

        // Ekran Çizimi
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Saha Zemin & Çim Çizgileri
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#16a34a';
            for (let i = 0; i < canvas.height; i += 60) {
                if ((i / 60) % 2 === 0) {
                    ctx.fillRect(0, i, canvas.width, 60);
                }
            }

            // Ceza Sahası Çizgisi
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 3;
            ctx.strokeRect(40, 140, 400, 300);

            // Kale Ağı ve Direkleri
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

            // Ağ Çizgileri
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            for (let x = goal.x; x <= goal.x + goal.width; x += 15) {
                ctx.beginPath();
                ctx.moveTo(x, goal.y);
                ctx.lineTo(x, goal.y + goal.height);
                ctx.stroke();
            }

            // Beyaz Kalıplar / Direkler
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(goal.x, goal.y, goal.width, goal.height);

            // Baraj Çizimi
            barrier.forEach(p => {
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                // Kafa
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(p.x + p.width / 2, p.y - 6, 7, 0, Math.PI * 2);
                ctx.fill();
            });

            // Kaleci Çizimi
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(goalkeeper.x - goalkeeper.width / 2, goalkeeper.y - goalkeeper.height / 2 - (ball.y < 260 ? 10 : 0), goalkeeper.width, goalkeeper.height);
            // Kaleci Kafası
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath();
            ctx.arc(goalkeeper.x, goalkeeper.y - goalkeeper.height / 2 - 8 - (ball.y < 260 ? 10 : 0), 9, 0, Math.PI * 2);
            ctx.fill();

            // Sürükleme Yön Çizgisi
            if (dragStart && dragCurrent) {
                ctx.strokeStyle = 'rgba(250, 204, 21, 0.8)';
                ctx.lineWidth = 4;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x + (dragCurrent.x - dragStart.x), ball.y + (dragCurrent.y - dragStart.y));
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Top Gölgesi
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(ball.x, ball.y, ball.radius * (1 - ball.z / 200), (ball.radius / 2) * (1 - ball.z / 200), 0, 0, Math.PI * 2);
            ctx.fill();

            // Topun Kendisi (Yüksekliğe Göre Ölçeklenir)
            const currentRadius = Math.max(4, ball.radius * (1 - ball.y / 1000) + ball.z * 0.1);
            const drawY = ball.y - ball.z;

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, drawY, currentRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
