
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Sığınak - 3D Zombi Oyunu</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d12;color:white;font-family:Arial}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#071019ee;text-align:center}
h1{font-size:48px;color:#70ff85}
button{padding:16px 40px;font-size:20px;color:white;background:#198b43;border:0;border-radius:9px;cursor:pointer}
#hud{position:fixed;top:15px;left:15px;z-index:5;font-size:19px;line-height:1.8;text-shadow:2px 2px 4px black}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;z-index:4;pointer-events:none}
#message{position:fixed;bottom:25px;width:100%;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="menu">
<h1>SON SIĞINAK</h1>
<h2>3D ZOMBİ KIYAMETİ</h2>
<p>Şehirde hayatta kal. Zombilere karşı savaş.</p>
<button id="start">OYUNA BAŞLA</button>
<p>WASD: Hareket | Fare: Bakış | Sol tık: Ateş</p>
</div>
<div id="hud">
❤️ Can: <span id="health">100</span><br>
☠️ Zombi: <span id="kills">0</span><br>
🌊 Dalga: <span id="wave">1</span><br>
⭐ Puan: <span id="score">0</span>
</div>
<div id="crosshair">+</div>
<div id="message">Hayatta kal!</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101923);
scene.fog=new THREE.Fog(0x101923,20,100);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
camera.position.set(0,1.7,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bbcff,0x303020,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-15,25,10);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x303638}));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const grid=new THREE.GridHelper(150,60,0x657070,0x3b4646);
grid.position.y=.02;
scene.add(grid);

const buildings=[];
function createBuilding(x,z,w,h,d){
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x39434a}));
 b.position.set(x,h/2,z);
 b.castShadow=true;
 b.receiveShadow=true;
 scene.add(b);
 buildings.push(b);
}
for(let i=0;i<35;i++){
 const x=(Math.random()-.5)*110;
 const z=(Math.random()-.5)*110;
 if(Math.abs(x)<12&&Math.abs(z)<12)continue;
 createBuilding(x,z,4+Math.random()*5,5+Math.random()*15,4+Math.random()*5);
}

const player={health:100,score:0,kills:0,alive:true};
let started=false,wave=1,yaw=0,pitch=0;
const keys={};
const zombies=[];
const bullets=[];
const clock=new THREE.Clock();
let spawnTimer=0,damageTimer=0;

document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});

function createZombie(){
 const zombie=new THREE.Group();
 const color=new THREE.Color().setHSL(.25+Math.random()*.12,.45,.35);
 const material=new THREE.MeshStandardMaterial({color});
 const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.5),material);
 body.position.y=1;
 body.castShadow=true;
 zombie.add(body);

 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,12),new THREE.MeshStandardMaterial({color:0x83a65a}));
 head.position.y=1.8;
 zombie.add(head);

 for(let i=-1;i<=1;i+=2){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),new THREE.MeshBasicMaterial({color:0xff2222}));
  eye.position.set(i*.12,1.85,.27);
  zombie.add(eye);
 }

 const angle=Math.random()*Math.PI*2;
 const distance=25+Math.random()*12;
 zombie.position.set(camera.position.x+Math.cos(angle)*distance,0,camera.position.z+Math.sin(angle)*distance);
 zombie.userData={health:2,speed:1.1+Math.random()*.7,attack:0};
 scene.add(zombie);
 zombies.push(zombie);
}

function shoot(){
 if(!started||!player.alive)return;
 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);
 const bullet=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0x7dffad}));
 bullet.position.copy(camera.position);
 bullet.userData={velocity:direction.multiplyScalar(45),life:2};
 scene.add(bullet);
 bullets.push(bullet);
}

document.addEventListener("mousedown",e=>{
 if(e.button===0)shoot();
});

document.getElementById("start").onclick=()=>{
 if(!started){
  started=true;
  document.getElementById("menu").style.display="none";
  renderer.domElement.requestPointerLock();
 }
};

document.addEventListener("keydown",e=>{
 if(e.code==="Escape"&&started&&player.alive){
  document.exitPointerLock();
  document.getElementById("menu").style.display="flex";
  document.querySelector("#menu h1").textContent="OYUN DURAKLATILDI";
  document.querySelector("#menu button").textContent="DEVAM ET";
  document.getElementById("start").onclick=()=>{
   document.getElementById("menu").style.display="none";
   renderer.domElement.requestPointerLock();
  };
 }
});

function updatePlayer(dt){
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=new THREE.Vector3();
 if(keys.KeyW||keys.ArrowUp)move.add(forward);
 if(keys.KeyS||keys.ArrowDown)move.sub(forward);
 if(keys.KeyD||keys.ArrowRight)move.add(right);
 if(keys.KeyA||keys.ArrowLeft)move.sub(right);
 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(8*dt);
  camera.position.add(move);
 }
 camera.position.y=1.7;
 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-65,65);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-65,65);
}

function updateZombies(dt){
 for(let i=zombies.length-1;i>=0;i--){
  const z=zombies[i];
  const dx=camera.position.x-z.position.x;
  const dz=camera.position.z-z.position.z;
  const distance=Math.hypot(dx,dz);
  if(distance>1.35){
   z.position.x+=(dx/distance)*z.userData.speed*dt;
   z.position.z+=(dz/distance)*z.userData.speed*dt;
   z.lookAt(camera.position.x,0,camera.position.z);
  }else{
   z.userData.attack-=dt;
   if(z.userData.attack<=0){
    player.health=Math.max(0,player.health-8);
    z.userData.attack=.8;
   }
  }
 }
}

function updateBullets(dt){
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.position.addScaledVector(b.userData.velocity,dt);
  b.userData.life-=dt;
  let hit=false;
  for(let j=zombies.length-1;j>=0;j--){
   if(b.position.distanceTo(zombies[j].position.clone().add(new THREE.Vector3(0,1,0)))<1){
    zombies[j].userData.health--;
    if(zombies[j].userData.health<=0){
     scene.remove(zombies[j]);
     zombies.splice(j,1);
     player.kills++;
     player.score+=100;
    }
    hit=true;
    break;
   }
  }
  if(hit||b.userData.life<=0){
   scene.remove(b);
   bullets.splice(i,1);
  }
 }
}

function updateHUD(){
 document.getElementById("health").textContent=player.health;
 document.getElementById("kills").textContent=player.kills;
 document.getElementById("score").textContent=player.score;
 document.getElementById("wave").textContent=wave;
}

function gameOver(){
 player.alive=false;
 started=false;
 document.exitPointerLock();
 document.getElementById("menu").style.display="flex";
 document.querySelector("#menu h1").textContent="OYUN BİTTİ";
 document.querySelector("#menu h2").textContent="Puan: "+player.score;
 document.querySelector("#menu button").textContent="YENİDEN BAŞLA";
 document.getElementById("start").onclick=()=>location.reload();
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(started&&player.alive){
  updatePlayer(dt);
  updateZombies(dt);
  updateBullets(dt);

  spawnTimer+=dt;
  if(spawnTimer>Math.max(.5,2-wave*.08)){
   createZombie();
   spawnTimer=0;
  }

  if(player.kills>=wave*10){
   wave++;
   document.getElementById("message").textContent="DALGA "+wave+" BAŞLADI!";
  }

  if(player.health<=0)gameOver();
  updateHUD();
 }
 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
