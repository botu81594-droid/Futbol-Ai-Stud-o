
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON RACER - 3D Yarış Oyunu</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b13;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#080b13,#14233b);text-align:center;padding:20px}
h1{font-size:clamp(38px,10vw,60px);color:#00eaff;text-shadow:0 0 25px #00eaff}
button{padding:15px 30px;background:#00bcd4;color:white;border:0;border-radius:12px;font-size:20px;font-weight:bold}
#hud{position:fixed;top:10px;left:10px;font-size:16px;line-height:1.7;text-shadow:2px 2px 5px black;pointer-events:none}
#message{position:fixed;top:12px;width:100%;text-align:center;font-size:15px;pointer-events:none}
#nitro{position:fixed;right:12px;top:12px;width:100px;height:12px;background:#333;border:1px solid white}
#nitroFill{height:100%;width:100%;background:#00eaff}
#controls{position:fixed;bottom:20px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:5;pointer-events:none}
.controlGroup{display:flex;gap:12px;pointer-events:auto}
.control{width:65px;height:65px;border-radius:50%;background:#162d43dd;border:2px solid #00dfff;color:white;font-size:25px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
#nitroButton{width:75px;height:75px;background:#087eaa;font-size:15px;font-weight:bold}
#gasButton{width:75px;height:75px;background:#178b46;font-size:15px;font-weight:bold}
</style>
</head>
<body>

<div id="menu">
<h1>NEON RACER</h1>
<h2>3D ŞEHİR YARIŞI</h2>
<p>Telefon ve bilgisayar uyumlu yarış oyunu</p>
<p>Sol tuş sola, sağ tuş sağa yönlendirir.</p>
<p>GAZ ile hızlan, NİTRO ile hızını artır!</p>
<button id="start">YARIŞA BAŞLA</button>
</div>

<div id="hud">
🏁 Tur: <span id="lap">1</span>/3<br>
🏎️ Hız: <span id="speed">0</span> KM/H<br>
⭐ Puan: <span id="score">0</span><br>
⏱️ Süre: <span id="time">0</span>
</div>
<div id="nitro"><div id="nitroFill"></div></div>
<div id="message">Yarışa hazır ol!</div>

<div id="controls">
<div class="controlGroup">
<div class="control" id="left">◀</div>
<div class="control" id="right">▶</div>
</div>
<div class="controlGroup">
<div class="control" id="nitroButton">NİTRO</div>
<div class="control" id="gasButton">GAZ</div>
</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101a30);
scene.fog=new THREE.Fog(0x101a30,30,180);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
camera.position.set(0,7,13);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9dbbff,0x222233,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,30,20);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
new THREE.MeshStandardMaterial({color:0x252b35})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const road=new THREE.Mesh(
new THREE.PlaneGeometry(18,300),
new THREE.MeshStandardMaterial({color:0x17191e})
);
road.rotation.x=-Math.PI/2;
road.position.y=.03;
scene.add(road);

for(let z=-140;z<150;z+=10){
const line=new THREE.Mesh(
new THREE.BoxGeometry(.25,.04,5),
new THREE.MeshBasicMaterial({color:0xffffff})
);
line.position.set(0,.08,z);
scene.add(line);
}

for(const x of [-9,9]){
const edge=new THREE.Mesh(
new THREE.BoxGeometry(.4,.2,300),
new THREE.MeshStandardMaterial({color:0x00d9ff,emissive:0x004455})
);
edge.position.set(x,.12,0);
scene.add(edge);
}

for(let i=0;i<70;i++){
const side=Math.random()<.5?-1:1;
const w=4+Math.random()*7;
const h=8+Math.random()*35;
const d=5+Math.random()*8;
const building=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.58+Math.random()*.2,.3,.18)})
);
building.position.set(side*(14+Math.random()*25),h/2,-140+Math.random()*280);
scene.add(building);

for(let j=0;j<12;j++){
const windowLight=new THREE.Mesh(
new THREE.BoxGeometry(.5,.7,.05),
new THREE.MeshBasicMaterial({color:Math.random()>.5?0x00dfff:0xffd166})
);
windowLight.position.set(building.position.x+(Math.random()-.5)*w,Math.random()*h,building.position.z+d/2+.04);
scene.add(windowLight);
}
}

function createCar(color){
const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,4),new THREE.MeshStandardMaterial({color,metalness:.7,roughness:.25}));
body.position.y=.8;
car.add(body);

const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,1.8),new THREE.MeshStandardMaterial({color:0x152b3d,metalness:.5,roughness:.2}));
cabin.position.set(0,1.45,-.2);
car.add(cabin);

for(const x of [-1.1,1.1]){
for(const z of [-1.25,1.25]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.3,16),new THREE.MeshStandardMaterial({color:0x090909}));
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,.5,z);
car.add(wheel);
}}

for(const x of [-.75,.75]){
const light=new THREE.Mesh(new THREE.BoxGeometry(.45,.2,.1),new THREE.MeshBasicMaterial({color:0xffffff}));
light.position.set(x,.9,2.02);
car.add(light);

const rear=new THREE.Mesh(new THREE.BoxGeometry(.4,.2,.1),new THREE.MeshBasicMaterial({color:0xff1111}));
rear.position.set(x,.9,-2.02);
car.add(rear);
}
return car;
}

const playerCar=createCar(0x00aaff);
playerCar.position.set(0,0,5);
scene.add(playerCar);

const rivals=[];
for(let i=0;i<5;i++){
const rival=createCar([0xff3333,0xffcc00,0x9933ff,0x33ff66,0xffffff][i]);
rival.position.set((i%3-1)*5,0,-20-i*20);
rival.userData.speed=20+Math.random()*12;
scene.add(rival);
rivals.push(rival);
}

const keys={};
let touchLeft=false,touchRight=false,touchGas=false,touchNitro=false;

function bindTouch(id,callback){
const el=document.getElementById(id);
el.addEventListener("pointerdown",e=>{
e.preventDefault();
el.setPointerCapture(e.pointerId);
callback(true);
});
el.addEventListener("pointerup",e=>{e.preventDefault();callback(false)});
el.addEventListener("pointercancel",()=>callback(false));
el.addEventListener("lostpointercapture",()=>callback(false));
}

bindTouch("left",v=>touchLeft=v);
bindTouch("right",v=>touchRight=v);
bindTouch("gasButton",v=>touchGas=v);
bindTouch("nitroButton",v=>touchNitro=v);

document.addEventListener("keydown",e=>{
keys[e.code]=true;
if(e.code==="KeyR")location.reload();
});
document.addEventListener("keyup",e=>keys[e.code]=false);

let started=false,speed=0,score=0,lap=1,nitro=100,elapsed=0,finished=false;
const clock=new THREE.Clock();

document.getElementById("start").onclick=()=>{
started=true;
document.getElementById("menu").style.display="none";
document.getElementById("message").textContent="YARIŞ BAŞLADI!";
};

function updatePlayer(dt){
const accelerating=keys.KeyW||keys.ArrowUp||touchGas;
const braking=keys.KeyS||keys.ArrowDown;

// DÜZELTİLDİ: Sol tuş sola, sağ tuş sağa gider.
const left=keys.KeyA||keys.ArrowLeft||touchLeft;
const right=keys.KeyD||keys.ArrowRight||touchRight;
const nitroActive=(keys.Space||touchNitro)&&nitro>0&&speed>10;

if(accelerating)speed+=30*dt;
else speed-=10*dt;
if(braking)speed-=45*dt;

if(nitroActive){
speed+=45*dt;
nitro-=30*dt;
}else{
nitro=Math.min(100,nitro+10*dt);
}

speed=THREE.MathUtils.clamp(speed,0,100);

const steering=(right?1:0)-(left?1:0);
playerCar.position.x+=steering*(8+speed*.08)*dt;
playerCar.position.x=THREE.MathUtils.clamp(playerCar.position.x,-7,7);

playerCar.rotation.z=THREE.MathUtils.lerp(playerCar.rotation.z,-steering*.15,dt*5);
}

function updateRivals(dt){
for(const rival of rivals){
rival.position.z+=(speed*.22-rival.userData.speed*.22)*dt;
if(rival.position.z>15){
rival.position.z=-100-Math.random()*50;
rival.position.x=(Math.random()-.5)*12;
score+=250;
}
}
}

function collision(){
for(const rival of rivals){
if(playerCar.position.distanceTo(rival.position)<2.3){
speed*=.96;
document.getElementById("message").textContent="DİKKAT! RAKİBE ÇARPTIN!";
}
}
}

function updateCamera(dt){
const target=new THREE.Vector3(playerCar.position.x*.6,6,17);
camera.position.lerp(target,dt*3);
camera.lookAt(playerCar.position.x,1,-5);
}

function updateHUD(){
document.getElementById("speed").textContent=Math.round(speed*2);
document.getElementById("score").textContent=score;
document.getElementById("lap").textContent=lap;
document.getElementById("time").textContent=elapsed.toFixed(1);
document.getElementById("nitroFill").style.width=nitro+"%";
}

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);

if(started&&!finished){
elapsed+=dt;
updatePlayer(dt);
updateRivals(dt);
collision();
updateCamera(dt);
score+=Math.floor(speed*dt);

if(elapsed>30&&lap===1){
lap=2;
document.getElementById("message").textContent="İKİNCİ TUR!";
}
if(elapsed>60&&lap===2){
lap=3;
document.getElementById("message").textContent="SON TUR!";
}
if(elapsed>90){
finished=true;
document.getElementById("menu").style.display="flex";
document.querySelector("#menu h1").textContent="YARIŞ TAMAMLANDI!";
document.querySelector("#menu h2").textContent="Puan: "+score;
document.querySelector("#menu button").textContent="YENİDEN OYNA";
document.getElementById("start").onclick=()=>location.reload();
}
updateHUD();
}
renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
